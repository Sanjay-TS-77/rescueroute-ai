[project]
name = "rescueroute-ai"
version = "0.2.0"
description = "Autonomous food-rescue coordination with Strands Agents and Amazon Bedrock AgentCore"
requires-python = ">=3.10"
dependencies = [
  "strands-agents==1.54.0",
  "bedrock-agentcore==1.22.0",
  "boto3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
