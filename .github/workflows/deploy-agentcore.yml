name: Package AgentCore Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - aws-native-deployment

permissions:
  contents: read
  id-token: write

jobs:
  package-agentcore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install packaging tool
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Build ARM64-compatible AWS CodeZip
        run: |
          rm -rf deployment_package deployment_package.zip
          mkdir -p deployment_package
          uv pip install \
            --python-platform aarch64-manylinux2014 \
            --python-version 3.13 \
            --target deployment_package \
            --only-binary=:all: \
            -r requirements.txt
          cp -R rescueroute deployment_package/
          cp main.py lambda_handler.py deployment_package/
          cd deployment_package
          python -m zipfile -c ../deployment_package.zip .
          cd ..
          ls -lh deployment_package.zip

      - name: Verify package
        run: |
          python - <<'PY'
          import zipfile
          z = zipfile.ZipFile('deployment_package.zip')
          names = set(z.namelist())
          required = {
              'main.py',
              'lambda_handler.py',
              'rescueroute/graph_workflow.py',
              'rescueroute/agentcore_app.py',
              'rescueroute/static/index.html',
              'rescueroute/static/app.js',
              'rescueroute/static/styles.css',
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f'Missing required files: {missing}')
          print('AWS deployment package validation passed.')
          PY

      - name: Upload package as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rescueroute-agentcore-codezip
          path: deployment_package.zip
          if-no-files-found: error
          retention-days: 7

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::429056787959:role/RescueRouteGitHubDeployRole
          aws-region: ap-south-1

      - name: Upload verified CodeZip to private S3 bucket
        run: |
          aws s3 cp deployment_package.zip s3://rescueroute-ai-build-429056787959/agentcore/deployment_package.zip \
            --sse AES256 \
            --only-show-errors
          aws s3api head-object \
            --bucket rescueroute-ai-build-429056787959 \
            --key agentcore/deployment_package.zip \
            --query '{Size:ContentLength,ETag:ETag}'
