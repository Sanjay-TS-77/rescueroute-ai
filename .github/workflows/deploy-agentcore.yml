name: Validate AgentCore Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install packaging tool
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Build ARM64-compatible AgentCore CodeZip
        run: |
          rm -rf deployment_package deployment_package.zip
          mkdir -p deployment_package
          uv pip install \
            --python-platform aarch64-manylinux2014 \
            --python-version 3.13 \
            --target deployment_package \
            --only-binary=:all: \
            -r requirements.txt
          cp -R rescueroute deployment_package/
          cp main.py deployment_package/
          cd deployment_package
          python -m zipfile -c ../deployment_package.zip .
          cd ..
          ls -lh deployment_package.zip

      - name: Verify package
        run: |
          python - <<'PY'
          import zipfile
          z = zipfile.ZipFile('deployment_package.zip')
          names = set(z.namelist())
          required = {'main.py', 'rescueroute/graph_workflow.py', 'rescueroute/agentcore_app.py'}
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f'Missing required files: {missing}')
          print('AgentCore package validation passed.')
          PY
