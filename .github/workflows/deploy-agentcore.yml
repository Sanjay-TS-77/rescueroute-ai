name: Deploy AgentCore

on:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "rescueroute/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "scripts/deploy_agentcore.py"
      - ".github/workflows/deploy-agentcore.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  AGENTCORE_ARTIFACT_BUCKET: rescueroute-agentcore-429056787959-us-west-2
  AGENTCORE_ARTIFACT_KEY: RescueRouteAI/deployment_package.zip
  AGENTCORE_RUNTIME_NAME: RescueRouteAI
  AGENTCORE_RUNTIME_ROLE_ARN: arn:aws:iam::429056787959:role/RescueRouteAgentCoreRuntimeRole
  RESCUEROUTE_MODEL: global.anthropic.claude-sonnet-4-6

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::429056787959:role/RescueRouteGitHubDeployRole
          aws-region: us-west-2

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          pip install uv boto3

      - name: Build AgentCore ARM64 CodeZip
        run: |
          rm -rf deployment_package deployment_package.zip
          mkdir -p deployment_package
          uv pip install \
            --python-platform aarch64-manylinux2014 \
            --python-version 3.13 \
            --target deployment_package \
            --only-binary=:all: \
            -r requirements.txt
          cp -R rescueroute deployment_package/
          cp main.py deployment_package/
          cd deployment_package
          python -m zipfile -c ../deployment_package.zip .
          cd ..
          ls -lh deployment_package.zip

      - name: Upload CodeZip to S3
        run: |
          aws s3 cp deployment_package.zip "s3://${AGENTCORE_ARTIFACT_BUCKET}/${AGENTCORE_ARTIFACT_KEY}"

      - name: Create or update AgentCore runtime
        run: python scripts/deploy_agentcore.py
